<div class="ai-dock" id="ai-dock">
  <button type="button" class="ai-dock-toggle" id="ai-dock-toggle"
          aria-label="Show Ask AI" aria-expanded="false" aria-controls="ai-tab">
    <span aria-hidden="true">&#8250;</span>
  </button>
  <button class="ai-tab" id="ai-tab" type="button"
          aria-label="Open AI assistant" aria-controls="ai-drawer" aria-expanded="false">
    &#10024; Ask AI
  </button>
</div>
<script>window.CSRF_TOKEN = "{{ csrf_token }}";</script>
<aside class="ai-drawer" id="ai-drawer" aria-hidden="true">
  <header class="ai-head">
    <div>
      <strong>Study Assistant</strong>
      <span class="ai-subject" data-subject-id="{{ ai_subject_id }}">{{ ai_title }}</span>
    </div>
    <button type="button" class="ai-close" id="ai-close" aria-label="Close">&times;</button>
  </header>
  <div class="ai-messages" id="ai-messages">
    <div class="ai-msg ai-msg-bot">
      Hi! I can see the notes in <strong>{{ ai_title }}</strong>. Ask me any doubt about them.
    </div>
  </div>
  <form class="ai-input-row" id="ai-form">
    <textarea id="ai-input" rows="1" placeholder="Ask your doubt…" maxlength="2000"></textarea>
    <button class="btn btn-primary btn-sm" type="submit" id="ai-send">Send</button>
  </form>
</aside>
